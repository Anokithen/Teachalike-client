<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064B82" />
    <title>TeachAlike is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f2f8fc;
        color: #023859;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 12% 15%, rgb(84 172 191 / 20%), transparent 20rem),
          radial-gradient(circle at 88% 85%, rgb(139 92 246 / 12%), transparent 22rem),
          #f2f8fc;
      }

      main {
        width: min(100%, 30rem);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        text-align: center;
        border: 1px solid #dceaf3;
        border-radius: 2rem;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 1.25rem 3rem rgb(2 56 89 / 12%);
      }

      img {
        width: min(12rem, 55vw);
        height: auto;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: clamp(1.65rem, 7vw, 2.25rem);
      }

      p {
        margin: 0 auto 1.5rem;
        max-width: 24rem;
        color: #466b7e;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        padding: 0.75rem 1.25rem;
        background: #064b82;
        color: white;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 0.6rem 1.2rem rgb(6 75 130 / 20%);
      }

      a:focus-visible {
        outline: 3px solid #54acbf;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/Teachalike_logo.png"
        alt="TeachAlike — Learn. Listen. Grow."
        width="500"
        height="500"
      />
      <h1>You’re offline</h1>
      <p>
        TeachAlike needs an internet connection for reading sessions and
        account features. Reconnect, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
